<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://carnival-live.onrender.com/">
  <meta name="robots" content="noindex">
  <title>Opening Carnival Live</title>
  <script>
    const destination = new URL("https://carnival-live.onrender.com/");
    destination.pathname = window.location.pathname;
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.toString());
  </script>
</head>
<body>
  <p>Opening <a href="https://carnival-live.onrender.com/">Carnival Live</a>…</p>
</body>
</html>
